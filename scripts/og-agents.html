<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Geist";
        src: url("../node_modules/geist/dist/fonts/geist-sans/Geist-Variable.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Instrument Serif";
        font-style: italic;
        src: url("../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2") format("woff2");
      }
      :root {
        --bg: #0f0e0c;
        --ink: #f3f0ea;
        --muted: #a29c92;
        --accent: #ff5a1f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 627px;
        background: var(--bg);
        color: var(--ink);
        font-family: "Geist", sans-serif;
        overflow: hidden;
      }
      .card {
        width: 1200px;
        height: 627px;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      h1 {
        margin: 0;
        font-weight: 500;
        font-size: 176px;
        line-height: 0.88;
        letter-spacing: -0.055em;
      }
      .period {
        color: var(--accent);
      }
      .lede {
        margin: 48px 0 0;
        font-size: 68px;
        line-height: 1.04;
        letter-spacing: -0.035em;
        font-weight: 500;
      }
      .serif {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-weight: 400;
        color: var(--muted);
        font-size: 1.12em;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>your senior<br />engineer<span class="period">.</span></h1>
      <p class="lede">for apps w/ paying users,<br /><span class="serif">by subscription.</span></p>
    </main>
  </body>
</html>
