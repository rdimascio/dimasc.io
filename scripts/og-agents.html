<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Geist";
        src: url("../node_modules/geist/dist/fonts/geist-sans/Geist-Variable.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("../node_modules/geist/dist/fonts/geist-mono/GeistMono-Variable.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Instrument Serif";
        font-style: italic;
        src: url("../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2") format("woff2");
      }
      :root {
        --bg: #0f0e0c;
        --ink: #f3f0ea;
        --ink-2: #d6d2ca;
        --muted: #a29c92;
        --line: #2b2925;
        --accent: #ff5a1f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 627px;
        background: var(--bg);
        color: var(--ink);
        font-family: "Geist", sans-serif;
        overflow: hidden;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 627px;
        padding: 72px 72px 64px;
        display: flex;
        flex-direction: column;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: "Geist Mono", monospace;
        font-size: 19px;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      .name {
        color: var(--ink-2);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
      }
      h1 {
        margin: auto 0 0;
        font-weight: 500;
        font-size: 168px;
        line-height: 0.9;
        letter-spacing: -0.055em;
      }
      .period {
        color: var(--accent);
      }
      .bottom {
        margin-top: 44px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 48px;
      }
      .lede {
        margin: 0;
        font-size: 33px;
        line-height: 1.2;
        letter-spacing: -0.02em;
        font-weight: 500;
        max-width: 760px;
      }
      .serif {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-weight: 400;
        color: var(--muted);
        font-size: 1.12em;
        letter-spacing: 0;
      }
      .url {
        font-family: "Geist Mono", monospace;
        font-size: 22px;
        color: var(--ink-2);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="top">
        <span class="name">ryan dimascio</span>
        <span class="dot"></span>
      </div>
      <h1>agent<br />guardrails<span class="period">.</span></h1>
      <div class="bottom">
        <p class="lede">the hooks i use to let coding agents <span class="serif">ship real code.</span></p>
        <span class="url">dimasc.io/agents</span>
      </div>
    </main>
  </body>
</html>
